name: Rajbari Ranna Automated AI Poster Pipeline

on:
  push:
    branches: [ main ]      # Runs automatically on every git push
  schedule:
    - cron: '30 3 * * *'    # Runs daily at 09:00 AM IST
  workflow_dispatch:        # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write           # Grants permission to upload generated poster back to repo

jobs:
  run-ai-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code with History
        uses: actions/checkout@v5
        with:
          fetch-depth: 0    # Fetches full git commit history

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Output Directory
        run: |
          mkdir -p output

      - name: Start Local Web Server
        run: |
          python serve.py &
          sleep 3

      - name: Execute Rajbari Ranna AI Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
        run: |
          python git_delta_poster_pipeline.py

      - name: Auto-Commit Generated Poster to GitHub Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git commit -m "chore: auto-update generated poster artwork [skip ci]" || true
          git push

      - name: Archive Generated Poster Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudkitchen-promotional-poster
          path: output/*
